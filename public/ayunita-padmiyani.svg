<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Studio Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Hair Gradient -->
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1E24" />
      <stop offset="50%" stop-color="#0F1015" />
      <stop offset="100%" stop-color="#050508" />
    </linearGradient>

    <!-- Skin Tone Gradient -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F4C7A7" />
      <stop offset="60%" stop-color="#EBB692" />
      <stop offset="100%" stop-color="#DC9F78" />
    </linearGradient>

    <!-- Blazer Gradient -->
    <linearGradient id="blazerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D313A" />
      <stop offset="40%" stop-color="#181A20" />
      <stop offset="100%" stop-color="#0A0B0D" />
    </linearGradient>

    <!-- Gold Pin Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF099" />
      <stop offset="40%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#997A15" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" rx="36" fill="url(#bgGrad)" />

  <!-- Subtle Studio Spotlight -->
  <circle cx="200" cy="170" r="140" fill="#FFFFFF" opacity="0.35" />

  <!-- Torso & Shoulders: Formal Suit Jacket / Blazer -->
  <path d="M 50 400 L 95 285 C 110 260 145 250 170 250 L 230 250 C 255 250 290 260 305 285 L 350 400 Z" fill="url(#blazerGrad)" />

  <!-- Back Hair (falling behind shoulders) -->
  <path d="M 125 150 C 110 200 115 280 125 320 C 135 325 150 315 150 280 L 150 210 L 250 210 L 250 280 C 250 315 265 325 275 320 C 285 280 290 200 275 150 Z" fill="url(#hairGrad)" />

  <!-- Neck -->
  <path d="M 172 195 L 172 260 C 172 272 184 278 200 278 C 216 278 228 272 228 260 L 228 195 Z" fill="url(#skinGrad)" />
  <!-- Neck shadow -->
  <path d="M 174 200 C 190 220 210 220 226 200 L 228 220 C 215 232 185 232 172 220 Z" fill="#C68962" opacity="0.5" />

  <!-- White Shirt Collar -->
  <polygon points="200,275 168,235 190,230" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />
  <polygon points="200,275 232,235 210,230" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- Black Tie -->
  <polygon points="193,248 207,248 204,260 196,260" fill="#111827" />
  <polygon points="194,260 206,260 212,380 200,400 188,380" fill="#1F2937" stroke="#111827" stroke-width="1" />
  <!-- Tie Knot Highlight -->
  <rect x="195" y="250" width="10" height="9" rx="2" fill="#374151" />

  <!-- Blazer Lapels -->
  <!-- Left Lapel (viewer's left) -->
  <polygon points="120,285 168,235 195,290 155,390 105,400" fill="#1E2229" stroke="#111317" stroke-width="1.5" />
  <!-- Right Lapel (viewer's right) -->
  <polygon points="280,285 232,235 205,290 245,390 295,400" fill="#181B20" stroke="#0F1014" stroke-width="1.5" />

  <!-- Official Kemenag Gold Pin Badge on Left Lapel -->
  <g transform="translate(195, 345)">
    <!-- Small badge oval & ribbon -->
    <ellipse cx="0" cy="0" rx="9" ry="8" fill="url(#goldGrad)" stroke="#785E0E" stroke-width="0.8" />
    <circle cx="0" cy="-1" r="5" fill="#006837" />
    <!-- Pin emblem detail -->
    <circle cx="0" cy="-1" r="2.5" fill="#D4AF37" />
    <path d="M -5 5 L 0 8 L 5 5 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Head Base -->
  <ellipse cx="200" cy="165" rx="58" ry="72" fill="url(#skinGrad)" />
  <!-- Chin definition -->
  <path d="M 172 205 C 185 235 215 235 228 205 Z" fill="#EBB692" opacity="0.4" />

  <!-- Ears -->
  <ellipse cx="140" cy="170" rx="9" ry="16" fill="#DC9F78" />
  <ellipse cx="260" cy="170" rx="9" ry="16" fill="#DC9F78" />

  <!-- Hair Cut & Flow: Front and Sides (Neat, Side-Parted Balinese Style) -->
  <path d="M 142 165 C 136 125 155 85 200 85 C 245 85 264 125 258 165 C 255 140 248 118 208 118 C 175 118 150 135 142 165 Z" fill="url(#hairGrad)" />
  <!-- Front Hair Fringe / Side Swept hairline -->
  <path d="M 148 140 C 160 115 190 115 220 125 C 245 133 252 155 254 175 C 250 148 238 135 215 130 C 185 124 162 132 148 140 Z" fill="#0D0E12" />
  <!-- Side strands tucked neatly behind ears -->
  <path d="M 142 145 C 138 175 142 210 148 230 C 145 205 143 175 145 150 Z" fill="#0A0B0E" />
  <path d="M 258 145 C 262 175 258 210 252 230 C 255 205 257 175 255 150 Z" fill="#0A0B0E" />

  <!-- Eyebrows -->
  <path d="M 162 148 Q 177 142 190 147" stroke="#2B1D16" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M 210 147 Q 223 142 238 148" stroke="#2B1D16" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Eyes -->
  <!-- Left Eye -->
  <ellipse cx="177" cy="162" rx="9" ry="6" fill="#FFFFFF" />
  <circle cx="178" cy="162" r="4.5" fill="#2E1C12" />
  <circle cx="179.5" cy="160.5" r="1.5" fill="#FFFFFF" />
  <path d="M 167 160 Q 177 155 187 160" stroke="#1A110B" stroke-width="2" fill="none" stroke-linecap="round" />

  <!-- Right Eye -->
  <ellipse cx="223" cy="162" rx="9" ry="6" fill="#FFFFFF" />
  <circle cx="222" cy="162" r="4.5" fill="#2E1C12" />
  <circle cx="223.5" cy="160.5" r="1.5" fill="#FFFFFF" />
  <path d="M 213 160 Q 223 155 233 160" stroke="#1A110B" stroke-width="2" fill="none" stroke-linecap="round" />

  <!-- Soft Eyelashes -->
  <path d="M 184 158 L 187 156" stroke="#1A110B" stroke-width="1.2" />
  <path d="M 226 158 L 229 156" stroke="#1A110B" stroke-width="1.2" />

  <!-- Nose -->
  <path d="M 200 162 L 198 182 Q 200 186 205 185" stroke="#C68962" stroke-width="1.8" stroke-linecap="round" fill="none" />
  <!-- Nostrils -->
  <circle cx="195" cy="184" r="1.2" fill="#B3744D" />
  <circle cx="205" cy="184" r="1.2" fill="#B3744D" />

  <!-- Cheeks Blush -->
  <ellipse cx="166" cy="178" rx="8" ry="4" fill="#F87171" opacity="0.25" />
  <ellipse cx="234" cy="178" rx="8" ry="4" fill="#F87171" opacity="0.25" />

  <!-- Mouth & Warm Friendly Smile -->
  <path d="M 186 198 Q 200 209 214 198" fill="#C53030" stroke="#9B2C2C" stroke-width="1.5" stroke-linecap="round" />
  <path d="M 188 198 Q 200 204 212 198" fill="#FFFFFF" />
  <path d="M 189 201 Q 200 208 211 201" fill="#E53E3E" />

  <!-- Frame Accent Border -->
  <rect x="2" y="2" width="396" height="396" rx="34" fill="none" stroke="#D4AF37" stroke-width="3" opacity="0.6" />
</svg>
